name: CI
on: [push, pull_request]
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: foundry-rs/foundry-toolchain@v1
        with: { version: nightly }
      - run: forge test --gas-report
        working-directory: contracts
      - run: forge coverage --report summary
        working-directory: contracts
      - run: forge test --match-contract DripVaultFork --fork-url https://mainnet.base.org -vv
        working-directory: contracts
        env: { BASE_RPC: https://mainnet.base.org }
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: app/package-lock.json }
      - run: npm ci
        working-directory: app
      - run: npm run build
        working-directory: app
      - run: npx vitest run
        working-directory: app
